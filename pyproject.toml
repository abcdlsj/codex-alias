[project]
name = "codex-alias"
version = "0.3.0"
description = "Run multiple Codex accounts/profiles with isolated homes, wrapper commands, and session migration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "abcdlsj" }]
keywords = ["codex", "cli", "profile", "alias", "manager"]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/abcdlsj/codexswitch"
Repository = "https://github.com/abcdlsj/codexswitch"

[project.scripts]
codexalias = "codex_alias.cli:main"
codex-alias = "codex_alias.cli:main"
codexa = "codex_alias.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_alias"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
